<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Submitted — ETL Food Court</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #080808; color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; color: #0A0A0A; border-radius: 24px; padding: 40px 28px;
      max-width: 460px; text-align: center;
    }
    .tick {
      width: 76px; height: 76px; border-radius: 50%; background: #e9f9ef;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
      font-size: 40px; color: #22C55E;
    }
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #555; font-size: 15px; line-height: 1.5; }
    .badge {
      display: inline-block; margin-top: 18px; padding: 8px 16px;
      background: #f3f3f3; border-radius: 999px; font-size: 13px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tick">&#10003;</div>
    <h1>Application Submitted!</h1>
    <p>Thank you. Your application for <b>{{ outlet_name }}</b> at
       <b>{{ court_name }}</b> has been received.</p>
    <p style="margin-top:12px;">Our team will review your details and documents.
       Once approved, you'll receive an email with a link to set your password and
       access the Outlet Manager app.</p>
    <div class="badge">Status: Pending Review</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outlet Onboarding — ETL Food Court</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #080808; color: #fff; min-height: 100vh; padding: 24px 16px 60px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 30px; letter-spacing: -0.5px; }
    .header h1 .r { color: #D02128; }
    .header p { color: #888; font-size: 14px; margin-top: 8px; }
    .card {
      background: #fff; color: #0A0A0A; border-radius: 22px; padding: 24px;
    }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
    label .opt { color: #aaa; font-weight: 500; }
    input, select {
      width: 100%; padding: 13px 14px; border: 1.5px solid #e5e5e5;
      border-radius: 12px; font-size: 15px; background: #fafafa; color: #0A0A0A;
    }
    input:focus, select:focus { outline: none; border-color: #0A0A0A; background: #fff; }
    input[type="file"] { padding: 10px; font-size: 13px; }
    .hint { font-size: 12px; color: #999; margin-top: 5px; }
    .section-title {
      font-size: 12px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.5px; color: #888; margin: 24px 0 12px;
    }
    button {
      width: 100%; padding: 16px; background: #D02128; color: #fff; border: none;
      border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer;
      margin-top: 8px;
    }
    button:active { transform: scale(0.99); }
    .err {
      background: #fdeaea; color: #c0392b; border-radius: 10px; padding: 12px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1><span class="r">E</span>TL <span class="r">F</span>OOD COURT</h1>
      <p>Outlet Onboarding Application</p>
    </div>

    <div class="card">
      <div id="err" class="err"></div>
      <form id="form" action="/onboarding/applications" method="post" enctype="multipart/form-data">

        <div class="section-title">Outlet Details</div>

        <div class="field">
          <label>Select Court</label>
          <select name="court_id" required>
            <option value="" disabled selected>Choose a court…</option>
            {% for c in courts %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field">
          <label>Outlet / Brand Name</label>
          <input type="text" name="outlet_name" placeholder="e.g. I.M.M.MOMO" required />
        </div>

        <div class="section-title">Owner Details</div>

        <div class="field">
          <label>Owner Full Name</label>
          <input type="text" name="owner_name" placeholder="Full name" required />
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input type="tel" name="owner_phone" placeholder="10-digit mobile" required />
        </div>

        <div class="field">
          <label>Email Address</label>
          <input type="email" name="owner_email" placeholder="you@example.com" required />
          <div class="hint">This email will be used to log in to the Outlet Manager app.</div>
        </div>

        <div class="section-title">Documents <span style="font-weight:500;text-transform:none;">(PDF / image)</span></div>

        <div class="field">
          <label>GST Certificate <span class="opt">(optional)</span></label>
          <input type="file" name="gst" accept=".pdf,image/*" />
        </div>
        <div class="field">
          <label>FSSAI License <span class="opt">(optional)</span></label>
          <input type="file" name="fssai" accept=".pdf,image/*" />
        </div>
        <div class="field">
          <label>Term Sheet <span class="opt">(optional)</span></label>
          <input type="file" name="term_sheet" accept=".pdf,image/*" />
        </div>
        <div class="field">
          <label>Agreement <span class="opt">(optional)</span></label>
          <input type="file" name="agreement" accept=".pdf,image/*" />
        </div>

        <button type="submit" id="submitBtn">Submit Application</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const errBox = document.getElementById('err');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', () => {
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Submitting…';
    });
  </script>
</body>
</html>

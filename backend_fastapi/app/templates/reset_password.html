<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Your Password — ETL Food Court</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #080808; color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; color: #0A0A0A; border-radius: 24px; padding: 32px 26px;
      max-width: 420px; width: 100%;
    }
    h1 { font-size: 24px; margin-bottom: 6px; }
    h1 .r { color: #D02128; }
    .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
    input {
      width: 100%; padding: 13px 14px; border: 1.5px solid #e5e5e5;
      border-radius: 12px; font-size: 15px; background: #fafafa; margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #0A0A0A; background: #fff; }
    button {
      width: 100%; padding: 15px; background: #D02128; color: #fff; border: none;
      border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .msg { font-size: 14px; padding: 12px; border-radius: 10px; margin-bottom: 16px; display: none; }
    .msg.ok { background: #e9f9ef; color: #15803d; display: block; }
    .msg.err { background: #fdeaea; color: #c0392b; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="r">R</span>eset Password</h1>
    <p class="sub">Choose a new password for your ETL account.</p>

    <div id="msg" class="msg"></div>

    <div id="formArea">
      <label>New Password</label>
      <input type="password" id="pw1" placeholder="At least 6 characters" />
      <label>Confirm Password</label>
      <input type="password" id="pw2" placeholder="Re-enter password" />
      <button id="btn" onclick="submitPw()">Reset Password</button>
    </div>
  </div>

  <script>
    const token = "{{ token }}";
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    function show(type, text) {
      msg.className = 'msg ' + type;
      msg.textContent = text;
    }

    async function submitPw() {
      const p1 = document.getElementById('pw1').value;
      const p2 = document.getElementById('pw2').value;
      if (p1.length < 6) { show('err', 'Password must be at least 6 characters.'); return; }
      if (p1 !== p2) { show('err', 'Passwords do not match.'); return; }

      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, new_password: p1 }),
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('formArea').style.display = 'none';
          show('ok', (data.message || 'Password reset!') + ' You can now open the app and log in.');
        } else {
          show('err', data.detail || 'Could not reset password.');
          btn.disabled = false; btn.textContent = 'Reset Password';
        }
      } catch (e) {
        show('err', 'Network error. Please try again.');
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    }
  </script>
</body>
</html>
